<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:16px;background:var(--color-canvas)}#root{display:grid;gap:var(--space-md)}.row{display:flex;flex-wrap:wrap;gap:var(--space-sm);align-items:center}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-sm)}</style>
</head><body><div id="root"></div>
<script>window.UVALERT_ICON_BASE="../../assets/icons"</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const NS = window.UVAlertDesignSystem_d2ab25;
const { CountdownPanel, StatusCard, ZoneStatusRow, Button } = NS;
function Card(){return (<>
<CountdownPanel tone="soon" label="即將到期" minutes={28} progress={0.24} caption="預計 20:15 需要補擦" action={<Button>記錄補擦</Button>} />
<div className="grid2">
  <StatusCard tone="tracking" label="追蹤中" />
  <StatusCard tone="due" label="該補擦了" />
  <StatusCard tone="untimed" label="未計時" />
  <StatusCard tone="saved" label="已儲存" />
</div>
<div>
  <ZoneStatusRow zone="臉部" tone="due" stateLabel="該補擦了" remaining="0 分" />
  <ZoneStatusRow zone="頸部" tone="soon" stateLabel="即將到期" remaining="12 分" />
  <ZoneStatusRow zone="手背" tone="tracking" stateLabel="追蹤中" remaining="86 分" />
</div></>);}
ReactDOM.createRoot(document.getElementById("root")).render(<Card />);
</script></body></html>
