<!-- @dsCard group="Components" viewport="700x300" name="Core" subtitle="Buttons, links, inputs, badges, headings, readouts" -->
<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:16px;background:var(--color-canvas)}#root{display:grid;gap:var(--space-md)}.row{display:flex;flex-wrap:wrap;gap:var(--space-sm);align-items:center}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-sm)}</style>
</head><body><div id="root"></div>
<script>window.UVALERT_ICON_BASE="../../assets/icons"</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="./tweaks-panel.babel.js"></script>
<script type="text/babel">
const NS = window.UVAlertDesignSystem_d2ab25;
const { Button, TextLink, TextInput, BadgePill, PageHeading, StatFigure, SafetyNote, AppCard } = NS;
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "surfaceTemp": "warm ivory",
  "shape": "softened",
  "density": "standard"
}/*EDITMODE-END*/;
// Each tweak rewrites a whole band of tokens, so every component in the card
// re-reads them — these reshape the system's feel, not one element's padding.
const TEMPS = {
  "bleached": {"--color-canvas":"#fbf9f5","--color-surface-soft":"#f4f1ea","--color-surface-card":"#eae5db","--color-surface-cream-strong":"#e0d9cb","--color-hairline":"#e2ddd2","--color-hairline-soft":"#efece4","--color-ink":"#282623","--color-body":"#514c45","--color-muted":"#6b655c","--color-primary":"#8d6046","--color-primary-active":"#6f4b37","--color-primary-disabled":"#e2d5c9"},
  "warm ivory": {},
  "dusk clay": {"--color-canvas":"#f3e6da","--color-surface-soft":"#eddcce","--color-surface-card":"#e5cfbd","--color-surface-cream-strong":"#dcbda6","--color-hairline":"#dcc3b3","--color-hairline-soft":"#e8d5c7","--color-ink":"#33241d","--color-body":"#5c4137","--color-muted":"#775448","--color-primary":"#a8543a","--color-primary-active":"#873f2c","--color-primary-disabled":"#e0c1b1"}
};
const SHAPES = {
  "capsule": {"--radius-xs":"8px","--radius-sm":"14px","--radius-md":"22px","--radius-lg":"28px","--radius-pill":"999px"},
  "softened": {},
  "squared": {"--radius-xs":"1px","--radius-sm":"2px","--radius-md":"3px","--radius-lg":"4px","--radius-pill":"3px"}
};
const DENSITIES = {
  "airy": {"--space-xxs":"6px","--space-xs":"12px","--space-sm":"18px","--space-md":"24px","--space-lg":"30px","--space-xl":"38px","--space-xxl":"48px","--font-size-body-md":"17px","--font-size-body-sm":"15px","--font-size-display-md":"40px","--font-size-title-sm":"17px","--line-height-body":"1.75"},
  "standard": {},
  "compact": {"--space-xxs":"2px","--space-xs":"6px","--space-sm":"8px","--space-md":"11px","--space-lg":"13px","--space-xl":"16px","--space-xxl":"22px","--font-size-body-md":"15px","--font-size-body-sm":"13px","--font-size-display-md":"27px","--font-size-title-sm":"15px","--line-height-body":"1.45"}
};
function Card(){
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  React.useEffect(() => {
    const el = document.documentElement, applied = Object.assign({}, TEMPS[t.surfaceTemp], SHAPES[t.shape], DENSITIES[t.density]);
    Object.entries(applied).forEach(([k, v]) => el.style.setProperty(k, v));
    return () => Object.keys(applied).forEach(k => el.style.removeProperty(k));
  }, [t.surfaceTemp, t.shape, t.density]);
  return (<>
<div className="row">
  <Button variant="primary">記錄已補擦</Button>
  <Button variant="secondary">調整部位</Button>
  <Button variant="quiet">再試一次</Button>
  <Button variant="primary" disabled>下一步</Button>
  <TextLink as="button">查看說明</TextLink>
  <BadgePill>補擦時機</BadgePill>
  <BadgePill variant="unverified">標示尚未確認</BadgePill>
</div>
<div className="grid2">
  <TextInput label="裝備名稱" placeholder="每日防曬乳" hint="只保存在這台裝置" />
  <AppCard><PageHeading eyebrow="防曬衛教" title="了解今天的 UV" /><p className="body-sm">剩餘 <StatFigure variant="inline">28</StatFigure> 分鐘</p></AppCard>
</div>
<SafetyNote>防曬提醒是協助你回看紀錄的工具，不是安全曝曬時間或防護效果保證。</SafetyNote>
<TweaksPanel>
  <TweakSection label="表面溫度" />
  <TweakRadio label="Surface" value={t.surfaceTemp} options={["bleached","warm ivory","dusk clay"]} onChange={(v)=>setTweak("surfaceTemp",v)} />
  <TweakSection label="形狀語彙" />
  <TweakRadio label="Shape" value={t.shape} options={["capsule","softened","squared"]} onChange={(v)=>setTweak("shape",v)} />
  <TweakSection label="密度與字級" />
  <TweakRadio label="Density" value={t.density} options={["airy","standard","compact"]} onChange={(v)=>setTweak("density",v)} />
</TweaksPanel></>);}
ReactDOM.createRoot(document.getElementById("root")).render(<Card />);
</script></body></html>
