<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;height:100%}.tile{display:grid;grid-template-columns:1fr 96px;width:1280px;height:854px}.main{display:grid;place-items:center;background:var(--color-primary);padding:0 40px}.main img{width:520px;max-width:100%}.strip{display:grid;grid-template-rows:repeat(4,1fr)}</style>
</head><body>
<div class="tile">
  <div class="main"><img src="assets/logo/broadcast-mark-dark-surface.svg" alt="防曬晴報員 UVAlert"></div>
  <div class="strip">
    <div style="background:#E8A477"></div>
    <div style="background:#D9A35F"></div>
    <div style="background:#C1832E"></div>
    <div style="background:#8C6F7A"></div>
  </div>
</div>
</body></html>
