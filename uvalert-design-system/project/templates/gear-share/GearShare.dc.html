<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="UVAlert Gear Share Image" description="裝備分享圖版型 1080×1350，可匯出為 PNG" -->
<helmet><script src="./ds-base.js"></script><style>body{margin:0;background:#e9ddcf}</style></helmet>
<div style="padding: 40px; font-family: var(--font-sans); position: absolute; left: -10px; top: 10px">
<div style="width:1080px;height:1350px;background:var(--color-canvas);display:flex;flex-direction:column;padding:72px;box-sizing:border-box;position:relative;overflow:hidden">

<div style="display:flex;justify-content:space-between;align-items:center">
<img src="../../assets/logo/lockup-horizontal.svg" alt="防曬晴報員 UVAlert" style="height: 104px; width: 320px; object-fit: fill; align-self: auto">
<span style="font-family:var(--font-mono);font-size:26px;color:var(--color-muted);font-variant-numeric:tabular-nums">2026.08.23</span>
</div>

<h1 style="font-family:var(--font-display);font-weight:400;font-size:88px;line-height:1.14;letter-spacing:-0.02em;color:var(--color-ink);margin:48px 0 0;max-width:14em">我今天的防曬裝備</h1>

<div style="display:flex;align-items:baseline;gap:20px;margin-top:28px">
<span style="font-size:30px;color:var(--color-body)">臺北市 大安區</span>
<span style="width:1px;height:24px;background:var(--color-hairline)"></span>
<span style="font-size:30px;color:var(--color-body)">今日 UV</span>
<span style="font-family:var(--font-mono);font-size:34px;font-weight:600;color:var(--color-uvi-high);font-variant-numeric:tabular-nums">6</span>
<span style="font-size:30px;color:var(--color-body)">高量級</span>
</div>

<div style="margin-top:44px;background:var(--color-surface-dark);color:var(--color-on-dark);border-radius:var(--radius-lg);padding:44px 56px;display:flex;flex-direction:column;gap:24px">
<span style="font-size:26px;letter-spacing:.1em;color:var(--color-on-dark-soft)">主要防曬</span>
<span style="font-family:var(--font-display);font-weight:400;font-size:60px;line-height:1.2;letter-spacing:-0.01em">安耐曬 金鑽高效防曬露</span>
<div style="display: flex; gap: 72px; padding-top: 24px; border-top: 1px solid var(--color-hairline-on-dark); justify-content: space-between">
<div style="display:grid;gap:8px"><span style="font-size:24px;color:var(--color-on-dark-soft)">標示</span><span style="font-family:var(--font-mono);font-size:40px;font-weight:600;font-variant-numeric:tabular-nums">SPF 50+</span></div>
<div style="display:grid;gap:8px"><span style="font-size:24px;color:var(--color-on-dark-soft)">補擦間隔</span><span style="font-family:var(--font-mono);font-size:40px;font-weight:600;font-variant-numeric:tabular-nums">120 分</span></div>
<div style="display:grid;gap:8px"><span style="font-size:24px;color:var(--color-on-dark-soft)">情境</span><span style="font-size:36px">戶外運動</span></div>
</div>
</div>

<div style="display:flex;gap:24px;margin-top:16px">
<div style="flex:1;background:var(--color-surface-card);border-radius:var(--radius-lg);padding:32px;display:flex;flex-direction:column;gap:16px">
<div style="width:52px;height:52px;color:var(--icon-ink);display:grid;place-items:center"><div style="transform:scale(2.17)"><x-import component-from-global-scope="UVAlertDesignSystem_d2ab25.Icon" name="gear-hat" size="{{ s24 }}" base-path="../../assets/icons" hint-size="24px,24px"></x-import></div></div>
<span style="font-size:34px;line-height:1.3;color:var(--color-ink)">寬緣漁夫帽</span>
<span style="font-size:26px;color:var(--color-muted)">臉部、頸部遮蔽</span>
</div>
<div style="flex:1;background:var(--color-surface-card);border-radius:var(--radius-lg);padding:32px;display:flex;flex-direction:column;gap:16px">
<div style="width:52px;height:52px;color:var(--icon-ink);display:grid;place-items:center"><div style="transform:scale(2.17)"><x-import component-from-global-scope="UVAlertDesignSystem_d2ab25.Icon" name="gear-clothing" size="{{ s24 }}" base-path="../../assets/icons" hint-size="24px,24px"></x-import></div></div>
<span style="font-size:34px;line-height:1.3;color:var(--color-ink)">長袖防曬外套</span>
<span style="font-size:26px;color:var(--color-muted)">標示尚未確認</span>
</div>
<div style="flex:1;background:var(--color-surface-card);border-radius:var(--radius-lg);padding:32px;display:flex;flex-direction:column;gap:16px">
<div style="width:52px;height:52px;color:var(--icon-ink);display:grid;place-items:center"><div style="transform:scale(2.17)"><x-import component-from-global-scope="UVAlertDesignSystem_d2ab25.Icon" name="gear-sunglasses" size="{{ s24 }}" base-path="../../assets/icons" hint-size="24px,24px"></x-import></div></div>
<span style="font-size:34px;line-height:1.3;color:var(--color-ink)">偏光太陽眼鏡</span>
<span style="font-size:26px;color:var(--color-muted)">眼周防護</span>
</div>
</div>

<div style="flex:1"></div>

<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:48px;padding-top:40px;border-top:1px solid var(--color-hairline)">
<p style="margin: 0; font-size: 24px; line-height: 1.6; color: var(--color-muted); max-width: 26em; width: 672px; height: 78px">這是協助記得補擦的紀錄，不是安全曝曬時間或防護效果保證。UV 資料來源：中央氣象署 F-D0047-091。</p>
<span style="font-size:26px;color:var(--color-body);white-space:nowrap">uvalert.tw</span>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return { s24: 24 };
  }
}
</script>
</body>
</html>
