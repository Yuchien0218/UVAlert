<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--color-canvas);color:var(--color-ink)}.sw{display:flex;gap:var(--space-xs);flex-wrap:wrap}.chip{display:grid;gap:2px}.box{width:84px;height:52px;border-radius:var(--radius-sm);border:1px solid var(--color-hairline)}.n{font-size:11px;font-family:var(--font-mono);color:var(--color-muted)}.l{font-size:12px;font-weight:500}</style>
</head><body><div class="sw"><div class="chip"><div class="box" style="background:var(--color-surface-card);border-radius:4px"></div><span class="l">xs</span><span class="n">4px</span></div><div class="chip"><div class="box" style="background:var(--color-surface-card);border-radius:8px"></div><span class="l">sm</span><span class="n">8px</span></div><div class="chip"><div class="box" style="background:var(--color-surface-card);border-radius:14px"></div><span class="l">md</span><span class="n">14px</span></div><div class="chip"><div class="box" style="background:var(--color-surface-card);border-radius:20px"></div><span class="l">lg</span><span class="n">20px</span></div><div class="chip"><div class="box" style="background:var(--color-surface-card);border-radius:999px"></div><span class="l">pill</span><span class="n">999px</span></div></div></body></html>
