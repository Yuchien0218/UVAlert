<!-- @dsCard group="Spacing" viewport="700x150" name="Elevation" subtitle="Colour blocks first; shadows almost never" -->
<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--color-canvas);color:var(--color-ink)}.sw{display:flex;gap:var(--space-xs);flex-wrap:wrap}.chip{display:grid;gap:2px}.box{width:84px;height:52px;border-radius:var(--radius-sm);border:1px solid var(--color-hairline)}.n{font-size:11px;font-family:var(--font-mono);color:var(--color-muted)}.l{font-size:12px;font-weight:500}</style>
</head><body><div class="sw">
  <div class="chip"><div class="box" style="background:var(--color-canvas);border:0"></div><span class="l">flat</span></div>
  <div class="chip"><div class="box" style="background:var(--color-canvas)"></div><span class="l">hairline</span></div>
  <div class="chip"><div class="box" style="background:var(--color-surface-card);border:0"></div><span class="l">cream card</span></div>
  <div class="chip"><div class="box" style="background:var(--color-surface-dark);border:0"></div><span class="l">espresso</span></div>
  <div class="chip"><div class="box" style="background:var(--color-canvas);border:0;box-shadow:var(--shadow-float)"></div><span class="l">float (sheet)</span></div></div></body></html>
