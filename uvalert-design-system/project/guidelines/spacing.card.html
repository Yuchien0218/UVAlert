<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--color-canvas);color:var(--color-ink)}.sw{display:flex;gap:var(--space-xs);flex-wrap:wrap}.chip{display:grid;gap:2px}.box{width:84px;height:52px;border-radius:var(--radius-sm);border:1px solid var(--color-hairline)}.n{font-size:11px;font-family:var(--font-mono);color:var(--color-muted)}.l{font-size:12px;font-weight:500}</style>
</head><body><div style="display:flex;align-items:flex-end;gap:var(--space-xs)"><div class="chip"><div style="width:4px;height:4px;background:var(--color-primary);border-radius:2px"></div><span class="l">xxs</span><span class="n">4</span></div><div class="chip"><div style="width:8px;height:8px;background:var(--color-primary);border-radius:2px"></div><span class="l">xs</span><span class="n">8</span></div><div class="chip"><div style="width:12px;height:12px;background:var(--color-primary);border-radius:2px"></div><span class="l">sm</span><span class="n">12</span></div><div class="chip"><div style="width:16px;height:16px;background:var(--color-primary);border-radius:2px"></div><span class="l">md</span><span class="n">16</span></div><div class="chip"><div style="width:20px;height:20px;background:var(--color-primary);border-radius:2px"></div><span class="l">lg</span><span class="n">20</span></div><div class="chip"><div style="width:24px;height:24px;background:var(--color-primary);border-radius:2px"></div><span class="l">xl</span><span class="n">24</span></div><div class="chip"><div style="width:32px;height:32px;background:var(--color-primary);border-radius:2px"></div><span class="l">xxl</span><span class="n">32</span></div><div class="chip"><div style="width:40px;height:40px;background:var(--color-primary);border-radius:2px"></div><span class="l">section</span><span class="n">40</span></div></div></body></html>
