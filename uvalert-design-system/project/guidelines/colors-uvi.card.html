<!-- @dsCard group="Colors" viewport="700x150" name="UV risk scale" subtitle="Low is blue, not green; always paired with the number" -->
<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--color-canvas);color:var(--color-ink)}.sw{display:flex;gap:var(--space-xs);flex-wrap:wrap}.chip{display:grid;gap:2px}.box{width:84px;height:52px;border-radius:var(--radius-sm);border:1px solid var(--color-hairline)}.n{font-size:11px;font-family:var(--font-mono);color:var(--color-muted)}.l{font-size:12px;font-weight:500}</style>
</head><body><div class="sw"><div class="chip"><div class="box" style="background:#507AA8"></div><span class="l">low 0–2</span><span class="n">#507AA8</span></div><div class="chip"><div class="box" style="background:#BD8500"></div><span class="l">moderate 3–5</span><span class="n">#BD8500</span></div><div class="chip"><div class="box" style="background:#D16627"></div><span class="l">high 6–7</span><span class="n">#D16627</span></div><div class="chip"><div class="box" style="background:#C43D3D"></div><span class="l">very-high 8–10</span><span class="n">#C43D3D</span></div><div class="chip"><div class="box" style="background:#7D4BB3"></div><span class="l">extreme 11+</span><span class="n">#7D4BB3</span></div></div><div style="display:flex;gap:var(--space-xs);flex-wrap:wrap;margin-top:var(--space-sm)">
  <span class="uvi-badge uvi-badge--low">低量級 <span class="stat-figure stat-figure--inline" style="color:inherit">2</span></span>
  <span class="uvi-badge uvi-badge--moderate">中量級 <span class="stat-figure stat-figure--inline" style="color:inherit">4</span></span>
  <span class="uvi-badge uvi-badge--high">高量級 <span class="stat-figure stat-figure--inline" style="color:inherit">7</span></span>
  <span class="uvi-badge uvi-badge--very-high">過量級 <span class="stat-figure stat-figure--inline" style="color:inherit">9</span></span>
  <span class="uvi-badge uvi-badge--extreme">危險級 <span class="stat-figure stat-figure--inline" style="color:inherit">11</span></span></div></body></html>
