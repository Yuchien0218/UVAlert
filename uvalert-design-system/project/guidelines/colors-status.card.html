<!-- @dsCard group="Colors" viewport="700x150" name="Status" subtitle="Five countdown states — 已儲存 is mauve, never green" -->
<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--color-canvas);color:var(--color-ink)}.sw{display:flex;gap:var(--space-xs);flex-wrap:wrap}.chip{display:grid;gap:2px}.box{width:84px;height:52px;border-radius:var(--radius-sm);border:1px solid var(--color-hairline)}.n{font-size:11px;font-family:var(--font-mono);color:var(--color-muted)}.l{font-size:12px;font-weight:500}</style>
</head><body><div class="sw"><div class="chip"><div class="box" style="background:#3F76A5"></div><span class="l">tracking</span><span class="n">#3F76A5</span></div><div class="chip"><div class="box" style="background:#BB6820"></div><span class="l">soon</span><span class="n">#BB6820</span></div><div class="chip"><div class="box" style="background:#C1442F"></div><span class="l">due</span><span class="n">#C1442F</span></div><div class="chip"><div class="box" style="background:#9D9591"></div><span class="l">untimed</span><span class="n">#9D9591</span></div><div class="chip"><div class="box" style="background:#7D5A69"></div><span class="l">saved</span><span class="n">#7D5A69</span></div></div><div style="display:flex;gap:var(--space-xs);flex-wrap:wrap;margin-top:var(--space-sm)">
  <span class="status-card status-card--tracking"><span class="status-card__label">追蹤中</span></span>
  <span class="status-card status-card--soon"><span class="status-card__label">即將到期</span></span>
  <span class="status-card status-card--due"><span class="status-card__label">該補擦了</span></span>
  <span class="status-card status-card--untimed"><span class="status-card__label">未計時</span></span>
  <span class="status-card status-card--saved"><span class="status-card__label">已儲存</span></span></div></body></html>
