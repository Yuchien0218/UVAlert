<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">

</head><body><div class="sw"><div class="chip"><div class="box" style="background:#2E2925"></div><span class="l">ink</span><span class="n">#2E2925</span></div><div class="chip"><div class="box" style="background:#46342F"></div><span class="l">body-strong</span><span class="n">#46342F</span></div><div class="chip"><div class="box" style="background:#5A4540"></div><span class="l">body</span><span class="n">#5A4540</span></div><div class="chip"><div class="box" style="background:#6F5A54"></div><span class="l">muted</span><span class="n">#6F5A54</span></div><div class="chip"><div class="box" style="background:#856D65"></div><span class="l">muted-soft</span><span class="n">#856D65</span></div><div class="chip"><div class="box" style="background:#E7D8CF"></div><span class="l">hairline</span><span class="n">#E7D8CF</span></div><div class="chip"><div class="box" style="background:#F0E6DE"></div><span class="l">hairline-soft</span><span class="n">#F0E6DE</span></div></div></body></html>
