<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>B8 字級量表—遷移規則確認中</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, "Noto Sans TC", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #151514; color: #f5f2ea; }
    main { width: min(680px, calc(100% - 40px)); }
    p { margin: 0 0 12px; color: #aaa79f; font-size: 14px; line-height: 1.6; }
    h1 { margin: 0 0 20px; font-size: 28px; line-height: 1.25; font-weight: 650; }
    .scale { display: flex; flex-wrap: wrap; gap: 8px; }
    span { padding: 7px 11px; border: 1px solid #3a3935; border-radius: 999px; color: #d8d4ca; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <p>B8 TYPOGRAPHY SCALE</p>
    <h1>字級已定稿，正在確認語意遷移規則</h1>
    <div class="scale" aria-label="已確認字級">
      <span>Page 28</span><span>Section 20</span><span>Card 18</span>
      <span>Body 16</span><span>Supporting 14</span><span>Caption 12</span><span>Nav 12</span>
    </div>
  </main>
</body>
</html>
