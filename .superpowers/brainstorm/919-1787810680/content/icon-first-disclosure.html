<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Icon-first 漸進揭露</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, "Noto Sans TC", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #151514; color: #f5f2ea; }
    main { width: min(1120px, calc(100% - 36px)); margin: 46px auto; }
    .eyebrow { margin: 0 0 10px; color: #aaa79f; font-size: 12px; letter-spacing: .08em; }
    h1 { margin: 0 0 12px; font-size: 28px; line-height: 1.25; }
    .intro { margin: 0 0 28px; color: #bcb8ae; font-size: 14px; line-height: 1.6; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    section { padding: 20px; border: 1px solid #35342f; border-radius: 18px; background: #1c1c1a; }
    .tag { color: #ddbc72; font-size: 12px; }
    h2 { margin: 8px 0 6px; font-size: 20px; }
    .desc { min-height: 67px; margin: 0 0 18px; color: #aaa79f; font-size: 14px; line-height: 1.6; }
    .row { display: grid; grid-template-columns: 32px 1fr auto; gap: 12px; align-items: center; min-height: 56px; padding: 8px 0; border-top: 1px solid #302f2b; }
    .icon { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 10px; background: #292823; color: #f1cb7c; font-size: 22px; }
    strong { display: block; font-size: 16px; font-weight: 620; }
    small { display: block; margin-top: 3px; color: #99968e; font-size: 12px; line-height: 1.4; }
    button { min-width: 44px; min-height: 44px; border: 0; background: transparent; color: #d2cec5; font: inherit; cursor: pointer; }
    .expanded { margin: 4px 0 10px 44px; padding: 12px 14px; border-radius: 12px; background: #24231f; color: #bcb8ae; font-size: 14px; line-height: 1.6; }
    .recommended { border-color: #77623a; box-shadow: 0 0 0 1px #77623a inset; }
    @media (max-width: 850px) { .grid { grid-template-columns: 1fr; } .desc { min-height: 0; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">NEXT VISUAL DIRECTION</p>
    <h1>圖示為主，說明按需要出現</h1>
    <p class="intro">三種做法都放大 icon；差別在於文字何時出現。建議保留一行可理解的標題，將較長說明收進展開區。</p>
    <div class="grid">
      <section>
        <span class="tag">A</span><h2>全部常駐</h2>
        <p class="desc">icon 變大，但標題與說明仍全部顯示。資訊最直接，畫面改善有限。</p>
        <div class="row"><span class="icon">☀</span><div><strong>防曬提醒</strong><small>依紫外線與外出時間提醒</small></div><button>›</button></div>
      </section>
      <section class="recommended">
        <span class="tag">B · 推薦</span><h2>一行標題＋按需展開</h2>
        <p class="desc">平時只顯示 icon 與必要標題；點擊資訊按鈕或整列後，才顯示說明。</p>
        <div class="row"><span class="icon">☀</span><div><strong>防曬提醒</strong></div><button aria-label="顯示防曬提醒說明">ⓘ</button></div>
        <div class="expanded">依紫外線與預計外出時間提供提醒。這段內容可再次收合。</div>
      </section>
      <section>
        <span class="tag">C</span><h2>只有 icon</h2>
        <p class="desc">最輕盈，但辨識高度依賴圖示與記憶；不適合重要設定或不常見功能。</p>
        <div class="row"><span class="icon">☀</span><div></div><button aria-label="防曬提醒">›</button></div>
      </section>
    </div>
  </main>
</body>
</html>
