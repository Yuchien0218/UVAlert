<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .ink { fill: #33291F; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #FAF5EC; }
    }
  </style>
  <!--
    2026-08-31：放大並做視覺置中（使用者裁決 #12）。

    幾何本身沒有動，只加一層 transform：

    - scale(1.25) —— 原本標記只佔 64 畫布的 34px 寬（53%），在 16px 的分頁
      圖示上細節幾乎看不見。放大到 42.5px（66%）。
    - 往右 1.5px —— 這是**視覺**置中不是幾何置中。標記左邊是實心圓點、
      右邊是三道細線條，質量偏左；幾何置中會看起來偏左。

    translate 的算法：內容 bbox 中心原本在 (31, 31.53)（瀏覽器 getBBox 實測），乘 1.25 之後是
    (38.75, 39.41)；要落在視覺中心 (33.5, 32)，所以 translate(-5.25 -7.41)。
  -->
  <g transform="translate(-5.25 -7.41) scale(1.25)">
    <circle cx="20" cy="32" r="6" fill="#C1832E"/>
    <path d="M30.03 25.71L40.03 19.71A2 2 0 0 0 37.97 16.29L27.97 22.29A2 2 0 0 0 30.03 25.71Z" class="ink"/>
    <path d="M32 34L46 34A2 2 0 0 0 46 30L32 30A2 2 0 0 0 32 34Z" class="ink"/>
    <path d="M28.03 41.75L37.03 46.75A2 2 0 0 0 38.97 43.25L29.97 38.25A2 2 0 0 0 28.03 41.75Z" fill="#C1832E"/>
  </g>
</svg>
