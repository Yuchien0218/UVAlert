<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <style>
    .ink { fill: #33291F; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #FAF5EC; }
    }
  </style>
  <!--
    2026-08-31：幾何改用使用者重新匯出的版本（docs/design/logo/app-icons/
    icon-512.svg），與 apple-touch-icon／icon-192／icon-512 完全一致。
    先前這裡是手寫的 64×64 版本，跟那批 PNG 各走各的，正是「改了一個、
    其他沒跟上」的來源。

    與 icon-512.svg 的兩處**刻意差異**：

    1. **沒有象牙底色的 rect。** 分頁圖示浮在瀏覽器自己的介面上，填一塊
       #FAF5EC 會在深色瀏覽器主題裡變成一個亮色方塊。
    2. **墨咖改用 .ink，在深色主題翻成象牙色。** 沒有底色就必須讓筆畫自己
       適應，否則深色分頁列上會看不見。琥珀金 #C1832E 兩邊對比都夠，不翻。

    這兩點只對 favicon 成立——app icon 是有底的方形圖磚，不能比照辦理。
  -->
  <circle cx="114.41" cy="257.86" r="79.41" fill="#C1832E"/>
  <path class="ink" d="M248.09,174.47l132.35-79.41c11.91-7.94,14.56-25.15,6.62-37.06-7.94-10.59-22.5-14.56-34.41-7.94l-132.35,79.41c-11.91,7.94-14.56,25.15-6.62,37.06,7.94,10.59,22.5,14.56,34.41,7.94Z"/>
  <path class="ink" d="M273.24,284.37h185.29c14.56,0,26.47-11.91,26.47-26.47s-11.91-26.47-26.47-26.47h-185.29c-14.56,0-26.47,11.91-26.47,26.47s11.91,26.47,26.47,26.47Z"/>
  <path d="M222.58,391.01l127.43,70.79c14.16,7.08,31.15,2.83,38.23-11.33,7.08-14.16,2.83-31.15-11.33-38.23h0l-127.43-70.79c-14.16-7.08-31.15-2.83-38.23,11.33-7.08,14.16-2.83,31.15,11.33,38.23Z" fill="#C1832E"/>
</svg>
