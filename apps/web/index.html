<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="light dark">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    >
    <title>防曬晴報員</title>
    <script>
      try {
        const appearance = localStorage.getItem("sunshield.appearance");
        if (appearance === "light" || appearance === "dark") {
          document.documentElement.dataset.theme = appearance;
        }
      } catch {
        // The Vue appearance controller applies the session preference.
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
