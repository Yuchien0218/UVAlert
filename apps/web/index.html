<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>防曬晴報員</title>
    <meta
      name="description"
      content="UVAlert 防曬晴報員：用提醒協助你記得補擦防曬，並保留本機紀錄。"
    />
    <!-- 私人 PWA shell 不是公開衛教內容；正式公開頁由 build-time 另行產生。 -->
    <meta name="robots" content="noindex,follow" />

    <!--
      沒有 manifest 就沒有安裝能力：Chrome 不會提供安裝、iOS「加到主畫面」
      只會得到書籤而不是 standalone。而 S-20 那頁把安裝說成「防止數據遺失
      的關鍵手段」——IndexedDB 在已安裝的 PWA 裡比較不容易被瀏覽器清掉。
      icon 檔早就在 public/，先前只是沒有任何東西引用。
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- iOS 不讀 manifest 的 icons，主畫面圖示只認這一條。 -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      本系統只有一套暖色亮色主題（DESIGN.md 第十節「深色模式：不做」）。
      值取自 packages/ui/src/styles.css 的 --page-background。
    -->
    <meta name="theme-color" content="#faf5ec" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
